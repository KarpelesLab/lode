name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# The compiler targets x86-64 Linux, and the tests run the executables it
# produces, so everything runs on an x86-64 Linux runner.
jobs:
  test:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same as rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: lode fmt --check
        # tests/programs/unsupported.lode uses syntax the parser rejects on
        # purpose, so the formatter refuses it. Exclude any other such file
        # the same way.
        run: |
          cargo run --quiet -- fmt --check std
          find tests/programs -name '*.lode' ! -name unsupported.lode -print0 \
            | sort -z | xargs -0 cargo run --quiet -- fmt --check
      - name: lode check --targets
        # Only x86-64 Linux is built. Checking std and the programs that
        # compile for AArch64 Linux too keeps its branches of `if comptime`
        # from rotting (docs/comptime.md). comptime_target.lode has such a
        # branch on purpose.
        run: |
          grep -l -E '^// (exit|stdout):' tests/programs/*.lode \
            | grep -v comptime_target.lode \
            | xargs -n1 cargo run --quiet -- check --targets=x86_64-linux,aarch64-linux

  hello:
    name: hello world
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y strace
      - name: Build, run and trace tests/programs/hello_world.lode
        run: |
          cargo run --quiet -- build tests/programs/hello_world.lode -O2 -o hello
          ./hello > out
          printf 'hello world\n' | cmp - out
          # System calls after execve, counted as in bench/hello/run.sh.
          strace -o trace ./hello > /dev/null
          cat trace
          calls=$(grep -v -e '^+++' -e '^---' -e 'execve(' trace | grep -c .)
          size=$(stat -c %s hello)
          {
            echo '### hello world (`-O2`)'
            echo
            echo '| bytes | syscalls |'
            echo '| ---: | ---: |'
            echo "| $size | $calls |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$calls" -ne 2 ]; then
            echo "::error::hello world made $calls system calls, expected 2"
            exit 1
          fi
      - name: Build and run tests/programs/list_numbers.lode
        # The reference program of docs/allocation.md (Code size): a
        # `List[u32]` filled from standard input, sorted and printed.
        run: |
          cargo run --quiet -- build tests/programs/list_numbers.lode -O2 -o list_numbers
          printf '42\n7\n1000\n3\n' | ./list_numbers > out
          printf '3 7 42 1000\n' | cmp - out
          size=$(stat -c %s list_numbers)
          {
            echo
            echo '### `List[u32]` from standard input (`-O2`)'
            echo
            echo '| bytes |'
            echo '| ---: |'
            echo "| $size |"
          } >> "$GITHUB_STEP_SUMMARY"

